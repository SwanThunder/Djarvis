name: djarvis_ui
description: "Djarvis desktop interface."
# Application package; never published to a package registry.
publish_to: 'none'

# On Windows, the build name supplies the product and file version parts and
# the build number supplies the build suffix.
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
